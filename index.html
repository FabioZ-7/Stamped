*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;padding:20px 16px 32px;max-width:520px;margin-inline:auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 2px 2px}
.sub{color:var(--muted);font-size:15px;margin:0 2px 16px}
.bar,.tabs,.c{background:var(--glass);border:1px solid var(--brd);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px var(--shadow)}
.bar{height:12px;border-radius:99px;overflow:hidden;margin:0 0 18px;padding:2px;background:var(--track)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .5s}
.tabs{display:flex;gap:4px;padding:4px;border-radius:22px;margin-bottom:16px}
.tabs button{flex:1;padding:11px 4px;border:0;border-radius:18px;background:none;color:var(--muted);font-size:14px;font-weight:600;transition:all .25s}
.tabs button.on{color:var(--text);background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 14px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button.main{width:100%;padding:17px;font-size:17px;font-weight:600;border:1px solid rgba(255,255,255,.5);border-radius:22px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05)),var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 28px var(--shadow)}
button.main:active{transform:scale(.98)}
button.main:disabled{opacity:.6}
#msg{min-height:22px;margin:12px 4px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{border-radius:26px;padding:18px 10px;text-align:center;cursor:pointer;transition:transform .2s,border-color .3s}
.c:active{transform:scale(.96)}
.c .e{font-size:42px;filter:grayscale(1);opacity:.4;transition:all .3s}
.c.on{border-color:var(--ok);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px var(--shadow),0 0 24px rgba(16,185,129,.35)}
.c.on .e{filter:none;opacity:1}
.c b{display:block;margin-top:6px;font-size:16px}
.c small{color:var(--muted);font-size:12px}
.c .v{display:block;font-size:24px;font-weight:700;margin-top:6px}
.fl{display:block;width:58px;height:38.7px;margin:4px auto 6px;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.reset{display:block;margin:22px auto 0;background:none;border:0;color:var(--muted);font-size:13px}
</style>
</head>

function km(a,b,c,d){var R=6371,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,

return 2*R*Math.asin(Math.sqrt(h))}

function render(){

document.getElementById("t1").className=tab==1?"on":"";
document.getElementById("t2").className=tab==2?"on":"";
document.getElementById("t3").className=tab==3?"on":"";
if(tab==3){profile();return}
var L=tab==1?PLACES:COUNTRIES,n=0,g=document.getElementById("grid");g.innerHTML="";
L.forEach(function(p){
var on=!!got[p.id];if(on)n++;
var d=document.createElement("div");d.className="c"+(on?" on":"");
d.innerHTML='<div class="e">'+(FL[p.id]?flag(p.id):p.e)+'</div><b>'+p.n+'</b><small>'+(on?got[p.id]:"antippen")+'</small>';
d.onclick=function(){toggle(p)};g.appendChild(d)});
document.getElementById("count").textContent=n;
document.getElementById("total").textContent=L.length;
document.getElementById("fill").style.width=(n/L.length*100)+"%"}
function say(t,c){var m=document.getElementById("msg");m.textContent=t;m.style.color=c||"var(--muted)"}
document.getElementById("go").onclick=function(){
var b=this;
if(!navigator.geolocation){say("Standort wird nicht unterstützt.","#dc2626");return}
b.disabled=true;say("Standort wird ermittelt …");
navigator.geolocation.getCurrentPosition(function(pos){
b.disabled=false;
var la=pos.coords.latitude,lo=pos.coords.longitude,hit=[],near=null,nd=1e9,today=new Date().toLocaleDateString("de-CH");
PLACES.forEach(function(p){
var d=km(la,lo,p.lat,p.lng);
if(d<nd){nd=d;near=p}
